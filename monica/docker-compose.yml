# Run Monica with fpm+nginx backend

version: "3.9"

services:
  app:
    image: monica
    depends_on:
      - db
#    ports:
#       - 8081:80
    environment:
      - APP_ENV=production
      - APP_URL=https://monica.home.aquiver.de
      - DB_HOST=db
    env_file:
      - .env
    volumes:
      - ./data:/var/www/html/storage
    restart: unless-stopped
    # Sablier waits for "healthy" before sending the user on to the app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 120s
#    user: '1000:1000'
    networks:
      - default
      - traefik_backbone
    labels:
      # Sablier: only run Monica while it is used (see ../sablier/README.md)
      - "sablier.enable=true"
      - "sablier.group=monica"
      - "traefik.http.middlewares.monica-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.monica-sablier.plugin.sablier.group=monica"
      - "traefik.http.middlewares.monica-sablier.plugin.sablier.sessionDuration=30m"
      - "traefik.http.middlewares.monica-sablier.plugin.sablier.dynamic.displayName=Monica"
      # Keep the route while the container is stopped (Traefik v3.6+)
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.routers.monica.middlewares=monica-sablier"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_backbone"
      - "traefik.http.routers.monica.rule=Host(`monica.home.aquiver.de`)"
      - "traefik.http.routers.monica.entrypoints=websecure"
      - "traefik.http.routers.monica.tls=true"
      - "traefik.http.routers.monica.tls.certresolver=wildcard-godaddy"
      - "traefik.http.routers.monica.service=monica-service@docker"
      - "traefik.http.services.monica-service.loadbalancer.server.port=80"

  db:
    image: mariadb:11
    environment:
      - MYSQL_DATABASE=monica
    env_file:
      - .env
    volumes:
      - ./mysql:/var/lib/mysql
      - ./db-dump:/db-dump
    labels:
      # Backup: dump the database to ./db-dump before archiving
      - "docker-volume-backup.exec-label=monica"
      - "docker-volume-backup.archive-pre=/bin/sh -c 'mariadb-dump --single-transaction --no-tablespaces -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" > /db-dump/monica.sql'"
      # Not managed by Sablier: the backup runs mariadb-dump in here
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    driver: bridge
    internal: true
  traefik_backbone:
    external: true
