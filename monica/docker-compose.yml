# Run Monica with fpm+nginx backend

version: "3.9"

services:
  app:
    image: monica
    depends_on:
      - db
#    ports:
#       - 8081:80
    environment:
      - APP_ENV=production
      - APP_URL=https://monica.${DOMAIN:?}
      - DB_HOST=db
      - DB_USERNAME=${DB_USERNAME:?}
      - DB_PASSWORD=${DB_PASSWORD:?}
      - APP_KEY=${APP_KEY:?}
    env_file:
      - .env
    volumes:
      - ${DATA_ROOT:?}/monica/data:/var/www/html/storage
    restart: unless-stopped
#    user: '1000:1000'
    networks:
      - default
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_backbone"
      - "traefik.http.routers.monica.rule=Host(`monica.${DOMAIN:?}`)"
      - "traefik.http.routers.monica.entrypoints=websecure"
      - "traefik.http.routers.monica.tls=true"
      - "traefik.http.routers.monica.tls.certresolver=wildcard-godaddy"
      - "traefik.http.routers.monica.service=monica-service@docker"
      - "traefik.http.services.monica-service.loadbalancer.server.port=80"

  db:
    image: mariadb:11
    environment:
      - MYSQL_DATABASE=monica
      - MYSQL_USER=${MYSQL_USER:?}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?}
    env_file:
      - .env
    volumes:
      - ${DATA_ROOT:?}/monica/mysql:/var/lib/mysql
      - ${DATA_ROOT:?}/monica/db-dump:/db-dump
    labels:
      # Backup: dump the database to ./db-dump before archiving
      - "docker-volume-backup.exec-label=monica"
      - "docker-volume-backup.archive-pre=/bin/sh -c 'mariadb-dump --single-transaction --no-tablespaces -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" > /db-dump/monica.sql'"
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    driver: bridge
    internal: true
  traefik_backbone:
    external: true
