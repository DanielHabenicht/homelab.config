global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

providers:
  docker:
    watch: true
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
log:
  level: DEBUG

# Sablier: start rarely used containers on demand, see ../sablier/README.md
# The plugin is downloaded from GitHub when Traefik starts.
experimental:
  plugins:
    sablier:
      moduleName: "github.com/sablierapp/sablier-traefik-plugin"
      version: "v1.4.0"

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  websecure:
    address: ":443"
    asDefault: true
    http:
      tls:
        domains:
          - main: aquiver.de
            sans:
              - "*.home.aquiver.de"
        certResolver: wildcard-godaddy


certificatesResolvers:
  wildcard-godaddy:
    acme:
      email: "daniel-habenich@outlook.de"
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0

