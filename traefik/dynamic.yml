# Go template, rendered by Traefik with the container environment.
# DNS: only routed on machines that set DNS_SERVER_URL.
{{ if env "DNS_SERVER_URL" }}
http:
  routers:
    dns:
      # By default, routers listen to every entry points
      rule: "Host(`dns.{{ env "DOMAIN" }}`)"
      service: "dns"
      tls:
        certResolver: wildcard-godaddy

  services:
    dns:
      loadBalancer:
        servers:
        - url: "{{ env "DNS_SERVER_URL" }}"
{{ end }}
