# Automated, encrypted backups of all stacks to the SMB share.
# One cron job per file in ./conf.d, see README.md.

services:
  backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      # Defaults for every file in ./conf.d (a file can override them)
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_PRUNING_LEEWAY: "10m"
      # Leave empty to store unencrypted archives
      AGE_PASSPHRASE: ${AGE_PASSPHRASE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./conf.d:/etc/dockervolumebackup/conf.d:ro
      # SMB share mounted on the host (see README). The sub folder must
      # exist on the share, so nothing is written to the local disk when
      # the share is not mounted: the container refuses to start instead.
      - type: bind
        source: ${BACKUP_TARGET:-/mnt/truenas_backup/homelab}
        target: /archive
        bind:
          create_host_path: false

      # Only application data, no config files or secrets
      - ../actual-budget/actual-data:/backup/actual-budget/actual-data:ro
      - ../bonds/bonds-data:/backup/bonds/bonds-data:ro
      - ../git-backup/backup:/backup/git-backup/backup:ro
      # Immich: originals and its own database dumps, no thumbnails/transcodes
      - ../immich/library/backups:/backup/immich/library/backups:ro
      - ../immich/library/library:/backup/immich/library/library:ro
      - ../immich/library/profile:/backup/immich/library/profile:ro
      - ../immich/library/upload:/backup/immich/library/upload:ro
      - ../monica/data:/backup/monica/data:ro
      - ../monica/db-dump:/backup/monica/db-dump:ro
      - ../paperless-ngx/export:/backup/paperless-ngx/export:ro
      - ../pocketid/data:/backup/pocketid/data:ro
      - ../super-productivity/webdav_data:/backup/super-productivity/webdav_data:ro
      - ../tandoor-recipes/db-dump:/backup/tandoor-recipes/db-dump:ro
      - ../tandoor-recipes/mediafiles:/backup/tandoor-recipes/mediafiles:ro
      - ../trilium/trilium-data:/backup/trilium/trilium-data:ro
      - ../ubiquiti/unifi-network-application/data/backup/autobackup:/backup/ubiquiti/autobackup:ro

      # Gramps uses named volumes
      - gramps_users:/backup/gramps/users:ro
      - gramps_db:/backup/gramps/db:ro
      - gramps_media:/backup/gramps/media:ro
    # Needs no network. Remove this if you add NOTIFICATION_URLS.
    network_mode: none

volumes:
  gramps_users:
    external: true
    name: gramps_gramps_users
  gramps_db:
    external: true
    name: gramps_gramps_db
  gramps_media:
    external: true
    name: gramps_gramps_media
