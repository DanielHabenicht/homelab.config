version: "3"
services:
  db_recipes-init:
    image: postgres:15-alpine
    volumes:
      - ./postgresql:/data
      - ./db-dump:/db-dump
    entrypoint:
      - sh
      - -c
      - |
        chown -R 1000:1000 /data /db-dump

  db_recipes:
    depends_on:
      db_recipes-init:
        condition: service_completed_successfully
    labels:
      # Backup: dump the database to ./db-dump before archiving
      - "docker-volume-backup.exec-label=tandoor-recipes"
      - "docker-volume-backup.archive-pre=/bin/sh -c 'pg_dumpall -U \"$$POSTGRES_USER\" > /db-dump/tandoor.sql'"
      # Not managed by Sablier: the backup runs pg_dumpall in here
    restart: always
    image: postgres:15-alpine
    user: "1000:1000"
    volumes:
      - ./postgresql:/var/lib/postgresql/data
      - ./db-dump:/db-dump
    env_file:
      - ./.env
    networks:
      - no-internet


  web_recipes:
    restart: unless-stopped
    image: vabene1111/recipes
    env_file:
      - ./.env
    environment:
      SOCIAL_PROVIDERS: "allauth.socialaccount.providers.openid_connect"
      SOCIALACCOUNT_PROVIDERS: '{"openid_connect": {"APPS": [{"provider_id": "pocketid","name": "Pocket ID","client_id": "10c2bd8d-d2e4-4e5d-90ab-f02e4144b91f","secret": "yOaAsuzQLGO2IowzUteSStt3hKyLxrny","settings": { "server_url": "https://auth.home.aquiver.de/.well-known/openid-configuration"}}]}}'
      SOCIALACCOUNT_LOGIN_ON_GET: 1
      ALLOWED_HOSTS: recipes.home.aquiver.de
      HIDE_LOGIN_FORM: 1
      SOCIALACCOUNT_ONLY: 1
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - ./mediafiles:/opt/recipes/mediafiles
    # depends_on:
    #   - db_recipes
    # Sablier waits for "healthy" before sending the user on to the app.
    # Any HTTP answer below 500 counts, Django only accepts the real host name.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u, urllib.error as e\ntry: u.urlopen(u.Request('http://localhost:80/', headers={'Host': 'recipes.home.aquiver.de'}), timeout=5)\nexcept e.HTTPError as x: exit(x.code >= 500)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 120s
    networks:
      - no-internet
      - internet
      - traefik_backbone

    labels: # traefik example labels
      # Sablier: only run Tandoor while it is used (see ../sablier/README.md)
      - "sablier.enable=true"
      - "sablier.group=tandoor"
      - "traefik.http.middlewares.recipes-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.recipes-sablier.plugin.sablier.group=tandoor"
      - "traefik.http.middlewares.recipes-sablier.plugin.sablier.sessionDuration=30m"
      - "traefik.http.middlewares.recipes-sablier.plugin.sablier.dynamic.displayName=Tandoor Recipes"
      # Keep the route while the container is stopped (Traefik v3.6+)
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.routers.recipes.middlewares=recipes-sablier"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_backbone"
      - "traefik.http.routers.recipes.entrypoints=websecure"
      - "traefik.http.routers.recipes.rule=Host(`recipes.home.aquiver.de`)"
      - "traefik.http.routers.recipes.tls=true"
      - "traefik.http.routers.recipes.tls.certresolver=wildcard-godaddy"
      - "traefik.http.routers.recipes.service=recipes-service@docker"
      - "traefik.http.services.recipes-service.loadbalancer.server.port=80"
      - "homepage.group=Apps"
      - "homepage.name=Tandoor Recipes"
      - "homepage.icon=tandoor-recipes"
      - "homepage.href=https://recipes.home.aquiver.de/"

networks:
  no-internet:
    driver: bridge
    internal: true
  internet:
    driver: bridge
  traefik_backbone:
    name: traefik_backbone
    external: true


volumes:
  staticfiles:
