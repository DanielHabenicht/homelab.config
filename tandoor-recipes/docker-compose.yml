version: "3"
services:
  db_recipes-init:
    image: postgres:15-alpine
    volumes:
      - ${DATA_ROOT:?}/tandoor-recipes/postgresql:/data
      - ${DATA_ROOT:?}/tandoor-recipes/db-dump:/db-dump
    entrypoint:
      - sh
      - -c
      - |
        chown -R 1000:1000 /data /db-dump

  db_recipes:
    depends_on:
      db_recipes-init:
        condition: service_completed_successfully
    labels:
      # Backup: dump the database to ./db-dump before archiving
      - "docker-volume-backup.exec-label=tandoor-recipes"
      - "docker-volume-backup.archive-pre=/bin/sh -c 'pg_dumpall -U \"$$POSTGRES_USER\" > /db-dump/tandoor.sql'"
    restart: always
    image: postgres:15-alpine
    user: "1000:1000"
    volumes:
      - ${DATA_ROOT:?}/tandoor-recipes/postgresql:/var/lib/postgresql/data
      - ${DATA_ROOT:?}/tandoor-recipes/db-dump:/db-dump
    env_file:
      - ./.env
    networks:
      - no-internet


  web_recipes:
    restart: always
    image: vabene1111/recipes
    env_file:
      - ./.env
    environment:
      SOCIAL_PROVIDERS: "allauth.socialaccount.providers.openid_connect"
      SOCIALACCOUNT_PROVIDERS: '{"openid_connect": {"APPS": [{"provider_id": "pocketid","name": "Pocket ID","client_id": "${OIDC_CLIENT_ID:?}","secret": "${OIDC_CLIENT_SECRET:?}","settings": { "server_url": "https://auth.${DOMAIN:?}/.well-known/openid-configuration"}}]}}'
      SOCIALACCOUNT_LOGIN_ON_GET: 1
      ALLOWED_HOSTS: recipes.${DOMAIN:?}
      HIDE_LOGIN_FORM: 1
      SOCIALACCOUNT_ONLY: 1
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - ${DATA_ROOT:?}/tandoor-recipes/mediafiles:/opt/recipes/mediafiles
    # depends_on:
    #   - db_recipes
    networks:
      - no-internet
      - internet
      - traefik_backbone

    labels: # traefik example labels
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_backbone"
      - "traefik.http.routers.recipes.entrypoints=websecure"
      - "traefik.http.routers.recipes.rule=Host(`recipes.${DOMAIN:?}`)"
      - "traefik.http.routers.recipes.tls=true"
      - "traefik.http.routers.recipes.tls.certresolver=wildcard-godaddy"
      - "traefik.http.routers.recipes.service=recipes-service@docker"
      - "traefik.http.services.recipes-service.loadbalancer.server.port=80"
      - "homepage.group=Apps"
      - "homepage.name=Tandoor Recipes"
      - "homepage.icon=tandoor-recipes"
      - "homepage.href=https://recipes.${DOMAIN:?}/"

networks:
  no-internet:
    driver: bridge
    internal: true
  internet:
    driver: bridge
  traefik_backbone:
    name: traefik_backbone
    external: true


volumes:
  staticfiles:
