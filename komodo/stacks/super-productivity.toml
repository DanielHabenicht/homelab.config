# Stack super-productivity, shared by every site that lists this file in its resource_sync.
[[stack]]
name = "super-productivity"
description = "To-do list with WebDAV sync"
[stack.config]
server = "local"
repo = "DanielHabenicht/homelab.config"
branch = "main"
run_directory = "super-productivity"
file_paths = ["docker-compose.yml"]
# Must stay the same as before the migration (docker compose ls), otherwise
# Docker creates new, empty named volumes
project_name = "super-productivity"
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
DATA_ROOT = [[DATA_ROOT]]
"""
