# Stack tandoor-recipes, shared by every site that lists this file in its resource_sync.
[[stack]]
name = "tandoor-recipes"
description = "Recipes"
[stack.config]
server = "local"
repo = "DanielHabenicht/homelab.config"
branch = "main"
run_directory = "tandoor-recipes"
file_paths = ["docker-compose.yml"]
# Must stay the same as before the migration (docker compose ls), otherwise
# Docker creates new, empty named volumes
project_name = "tandoor-recipes"
poll_for_updates = true
# The init container exits after fixing permissions
ignore_services = ["db_recipes-init"]
# Secrets (OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, POSTGRES_DB, POSTGRES_PASSWORD, POSTGRES_USER, SECRET_KEY) from the site's SOPS file, never written to disk
compose_cmd_wrapper = "SOPS_AGE_KEY_FILE=/etc/komodo/age.key sops exec-env ../komodo/sites/[[SITE]]/secrets/tandoor-recipes.env '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["config", "pull", "up"]
environment = """
DOMAIN = [[DOMAIN]]
DATA_ROOT = [[DATA_ROOT]]
DB_ENGINE = django.db.backends.postgresql
POSTGRES_HOST = db_recipes
POSTGRES_PORT = 5432
"""
