# Stack traefik, shared by every site that lists this file in its resource_sync.
[[stack]]
name = "traefik"
description = "Reverse proxy, TLS certificates"
[stack.config]
server = "local"
repo = "DanielHabenicht/homelab.config"
branch = "main"
run_directory = "traefik"
file_paths = ["docker-compose.yml"]
# Must stay the same as before the migration (docker compose ls), otherwise
# Docker creates new, empty named volumes
project_name = "traefik"
poll_for_updates = true
# Prepare a fresh machine: shared proxy network and certificate store
pre_deploy.command = """
docker network inspect traefik_backbone >/dev/null 2>&1 || docker network create --internal traefik_backbone
mkdir -p [[DATA_ROOT]]/traefik
test -e [[DATA_ROOT]]/traefik/acme.json || install -m 600 /dev/null [[DATA_ROOT]]/traefik/acme.json
"""
# Secrets (CF_DNS_API_TOKEN) from the site's SOPS file, never written to disk
compose_cmd_wrapper = "SOPS_AGE_KEY_FILE=/etc/komodo/age.key sops exec-env ../komodo/sites/[[SITE]]/secrets/traefik.env '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["config", "pull", "up"]
environment = """
DOMAIN = [[DOMAIN]]
DATA_ROOT = [[DATA_ROOT]]
ACME_EMAIL = [[ACME_EMAIL]]
DNS_SERVER_URL = [[DNS_SERVER_URL]]
"""
