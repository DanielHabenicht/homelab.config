# Stack git-backup, shared by every site that lists this file in its resource_sync.
[[stack]]
name = "git-backup"
description = "Mirrors GitHub repositories"
[stack.config]
server = "local"
repo = "DanielHabenicht/homelab.config"
branch = "main"
run_directory = "git-backup"
file_paths = ["docker-compose.yml"]
# Must stay the same as before the migration (docker compose ls), otherwise
# Docker creates new, empty named volumes
project_name = "git-backup"
poll_for_updates = true
environment = """
DOMAIN = [[DOMAIN]]
DATA_ROOT = [[DATA_ROOT]]
"""
