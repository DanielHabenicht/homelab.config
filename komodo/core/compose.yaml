# Komodo Core (UI + API) with FerretDB on Postgres as database.
# Based on https://github.com/moghtech/komodo/blob/main/compose/ferretdb.compose.yaml
#
# One Komodo Core per site. Deployed by hand (not by Komodo itself), with the
# site's settings and SOPS-encrypted secrets:
#   ./up.sh <site>
#
# The Periphery agent is not part of this file, it runs with systemd on the
# host so it can use sops, see ../README.md.

services:
  postgres:
    # Pin to a specific version, updates can be breaking.
    # https://github.com/FerretDB/documentdb/pkgs/container/postgres-documentdb
    image: ghcr.io/ferretdb/postgres-documentdb
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME:?}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?}
      POSTGRES_DB: postgres
    networks:
      - no-internet

  ferretdb:
    # Pin to a specific version, updates can be breaking.
    # https://github.com/FerretDB/FerretDB/pkgs/container/ferretdb
    image: ghcr.io/ferretdb/ferretdb
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres
    networks:
      - no-internet

  core:
    image: ghcr.io/moghtech/komodo-core:2
    init: true
    labels:
      komodo.skip:
      traefik.enable: true
      traefik.docker.network: traefik_backbone
      traefik.http.routers.komodo.rule: Host(`komodo.${DOMAIN:?}`)
      traefik.http.routers.komodo.service: komodo-service@docker
      traefik.http.services.komodo-service.loadbalancer.server.port: 9120
      homepage.group: Administration
      homepage.name: Komodo
      homepage.icon: komodo
      homepage.href: https://komodo.${DOMAIN:?}
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      # Periphery on this host connects to ws://127.0.0.1:9120. Also reachable
      # in the LAN as http://<host>:9120 before Traefik is deployed.
      - 9120:9120
    environment:
      KOMODO_HOST: https://komodo.${DOMAIN:?}
      KOMODO_TITLE: ${KOMODO_TITLE:-Komodo}
      TZ: Europe/Berlin
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:?}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?}
      # First login, change the password afterwards
      KOMODO_LOCAL_AUTH: true
      KOMODO_INIT_ADMIN_USERNAME: admin
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD:?}
      KOMODO_DISABLE_USER_REGISTRATION: true
      KOMODO_ENABLE_NEW_USERS: false
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET:?}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET:?}
      KOMODO_JWT_TTL: 1-day
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 5-min
    volumes:
      # Core / Periphery communication keys
      - keys:/config/keys
      # Dated database backups, see https://komo.do/docs/setup/backup
      - ${DATA_ROOT:?}/komodo/backups:/backups
    networks:
      - no-internet
      - traefik_backbone
      # Clones the sync repo and checks registries for image updates
      - internet

volumes:
  postgres-data:
  ferretdb-state:
  keys:

networks:
  no-internet:
    driver: bridge
    internal: true
  internet:
    driver: bridge
  traefik_backbone:
    name: traefik_backbone
    external: true
