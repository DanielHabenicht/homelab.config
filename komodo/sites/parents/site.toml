# Site "parents": my parents' place. Adjust the values before installing.
#
# The Komodo Core of this site syncs this folder (*.toml only) and the stacks
# listed in resource_path. Secrets are in ./secrets/<stack>.env, encrypted
# with SOPS for the admin key and this site's key (see /.sops.yaml).

[[server]]
name = "local"
description = "This site's Docker host (Periphery with systemd, sops installed)"
[server.config]
enabled = true

##

# Non-secret values, used as [[NAME]] in the stack environments
[[variable]]
name = "SITE"
description = "Name of this folder, used for the secrets path"
value = "parents"

[[variable]]
name = "DOMAIN"
description = "Every service is a subdomain of this"
value = "parents.aquiver.de"

[[variable]]
name = "DATA_ROOT"
description = "Application data, one folder per stack"
value = "/srv/homelab"

[[variable]]
name = "ACME_EMAIL"
description = "Let's Encrypt account e-mail"
value = "daniel-habenicht@outlook.de"

[[variable]]
name = "DNS_SERVER_URL"
description = "Routed as dns.<DOMAIN>, empty to disable"
value = ""

##

[[resource_sync]]
name = "homelab"
description = "Site parents from DanielHabenicht/homelab.config"
[resource_sync.config]
repo = "DanielHabenicht/homelab.config"
branch = "main"
# Which stacks run here: add or remove lines
resource_path = [
  "komodo/sites/parents",
  "komodo/stacks/traefik.toml",
  "komodo/stacks/homepage.toml",
  "komodo/stacks/pocketid.toml",
  "komodo/stacks/immich.toml",
  # backup/ is specific to home (other stacks, gramps volumes); needs its own variant here
]
include_resources = true
include_variables = true
# Deleting a stack here would remove it from Komodo, not stop it. Keep it off.
delete = false
webhook_enabled = false

##

# Applies the sync, then redeploys every stack whose compose file, environment
# or secrets changed. Unchanged stacks are left alone.
[[procedure]]
name = "deploy-on-push"
description = "Apply the resource sync, then redeploy changed stacks"
[procedure.config]
# Polls git, so GitHub does not need to reach this site.
# Alternatively use a GitHub webhook to .../listener/github/procedure/deploy-on-push/main
schedule_format = "English"
schedule = "Every 15 minutes"
schedule_enabled = true
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Sync resources"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab" },
]

[[procedure.config.stage]]
name = "Redeploy changed stacks"
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*" },
]
