# Non-secret values, used as [[NAME]] in the stack environments.
# This repository is public: secrets are NOT declared here, they are created
# as secret variables in the Komodo UI (Settings -> Variables), named
# <SERVER>_<STACK>_<KEY>, e.g. HOME_IMMICH_DB_PASSWORD. See komodo/README.md.

[[variable]]
name = "ACME_EMAIL"
description = "Let's Encrypt account e-mail"
value = "daniel-habenicht@outlook.de"

## Server: home

[[variable]]
name = "HOME_DOMAIN"
description = "Every service on home is a subdomain of this"
value = "home.aquiver.de"

[[variable]]
name = "HOME_DATA_ROOT"
description = "Application data on home, one folder per stack (outside of Komodo's clones)"
value = "/mnt/data/homelab"
