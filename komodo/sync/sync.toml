# Komodo Resource Sync: everything in komodo/sync/**/*.toml is applied to Komodo.
# Bootstrap: create this sync once by hand in the UI (see komodo/README.md),
# afterwards it manages itself from this file.

[[resource_sync]]
name = "homelab"
description = "Servers, stacks and variables from DanielHabenicht/homelab.config"
[resource_sync.config]
repo = "DanielHabenicht/homelab.config"
branch = "main"
resource_path = ["komodo/sync"]
include_resources = true
# Only the non-secret variables in variables.toml. Secrets are created in the UI.
include_variables = true
# Never enable together with include_variables: it would delete the secrets
# that only exist in the UI.
delete = false
# Pushes are handled by the deploy-on-push procedure below
webhook_enabled = false

##

# Runs on every push to main (GitHub webhook) or on its schedule:
# applies this sync, then redeploys every stack whose compose files or
# environment changed. Unchanged stacks are left alone.
[[procedure]]
name = "deploy-on-push"
description = "Apply the resource sync, then redeploy changed stacks"
[procedure.config]
# Fallback if the GitHub webhook can not reach Komodo.
# Keep disabled until all stacks are migrated (see komodo/README.md).
schedule_format = "English"
schedule = "Every 15 minutes"
schedule_enabled = false
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Sync resources"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab" },
]

[[procedure.config.stage]]
name = "Redeploy changed stacks"
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*" },
]
