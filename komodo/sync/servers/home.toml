# Machine "home" and the stacks running on it.
#
# Every stack clones this repository into Komodo's own folder and runs
# `docker compose` in its run_directory. The environment below is written to
# the .env file next to the compose file. [[NAME]] is replaced with the
# Komodo variable NAME: non-secret ones are in ../variables.toml, secrets
# (HOME_<STACK>_<KEY>) are created in the Komodo UI.
#
# project_name must stay the same as before the migration, otherwise Docker
# creates new (empty) named volumes and containers next to the old ones.

[[server]]
name = "home"
[server.config]
enabled = true

##

[[stack]]
name = "home-traefik"
description = "Reverse proxy, TLS certificates"
[stack.config]
server = "home"
repo = "DanielHabenicht/homelab.config"
branch = "main"
run_directory = "traefik"
file_paths = ["docker-compose.yml"]
project_name = "traefik"
poll_for_updates = true
# Prepare a fresh machine: shared proxy network and certificate store
pre_deploy.command = """
docker network inspect traefik_backbone >/dev/null 2>&1 || docker network create --internal traefik_backbone
mkdir -p [[HOME_DATA_ROOT]]/traefik
test -e [[HOME_DATA_ROOT]]/traefik/acme.json || install -m 600 /dev/null [[HOME_DATA_ROOT]]/traefik/acme.json
"""
environment = """
DOMAIN = [[HOME_DOMAIN]]
DATA_ROOT = [[HOME_DATA_ROOT]]
ACME_EMAIL = [[ACME_EMAIL]]
DNS_SERVER_URL = http://192.168.178.174:5380/
CF_DNS_API_TOKEN = [[HOME_TRAEFIK_CF_DNS_API_TOKEN]]
"""

