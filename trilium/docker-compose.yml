version: "3.9"

services:
  app:
    image: triliumnext/trilium:v0.103.0
    volumes:
      - ${DATA_ROOT:?}/trilium/trilium-data:/home/node/trilium-data
    restart: unless-stopped
#    user: '1000:1000'
    environment:
      TRILIUM_OAUTH_BASE_URL: "https://trilium.${DOMAIN:?}"
      TRILIUM_OAUTH_ISSUER_BASE_URL: "https://auth.${DOMAIN:?}"
      TRILIUM_OAUTH_ISSUER_NAME: "Pocket ID"
      TRILIUM_OAUTH_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      TRILIUM_OAUTH_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHBASEURL: "https://trilium.${DOMAIN:?}"
      TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERBASEURL: "https://auth.${DOMAIN:?}"
      TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHISSUERNAME: "Pocket ID"
      TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTID: ${OIDC_CLIENT_ID:?}
      TRILIUM_MULTIFACTORAUTHENTICATION_OAUTHCLIENTSECRET: ${OIDC_CLIENT_SECRET:?}
    networks:
      - default
      - traefik_backbone
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_backbone"
      - "traefik.http.routers.trilium.rule=Host(`trilium.${DOMAIN:?}`)"
      - "traefik.http.routers.trilium.service=trilium-service@docker"
      - "traefik.http.services.trilium-service.loadbalancer.server.port=8080"
      - "homepage.group=Media"
      - "homepage.name=Trilium"
      - "homepage.icon=trilium"
      - "homepage.href=https://trilium.${DOMAIN:?}"


networks:
  default:
    driver: bridge
    internal: true
  traefik_backbone:
    external: true
