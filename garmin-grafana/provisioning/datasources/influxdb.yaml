apiVersion: 1
datasources:
  - name: Garmin-InfluxDB
    # The dashboards refer to this uid
    uid: garmin_influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    user: influxdb_user
    database: GarminStats
    isDefault: true
    editable: false
    secureJsonData:
      password: $INFLUXDB_PASSWORD
    jsonData:
      httpMode: GET
